spring:
  datasource:
    url: jdbc:mysql://localhost:3306/digital_bank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: digital_bank
    password: digital_bank
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR

  flyway:
    enabled: true
    locations: classpath:db/migration
